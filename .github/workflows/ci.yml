name: Mobile CI

on:
  push:
    branches:
      - 'feature/**'

permissions:
  contents: read

jobs:
  checks:
    name: Mobile checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Run unit tests
        run: npm test
